[project]
name = "HTN-MORL-Planner"
version = "0.1.0"
description = """
A research prototype for a hybrid agent architecture that combines
Hierarchical Task Network planning with multi-objective reinforcement
learning.

The architecture separates four responsibilities: HTN defines tasks,
methods, preconditions, and effects; a preference source supplies the
current objective weights; a MORL policy selects one symbolically valid
decomposition method under those weights; and conventional controllers
execute the resulting primitive tasks.

The goal is to investigate how symbolic planning and reinforcement
learning can be integrated to produce agents with interpretable planning,
adaptive execution, and real-time decision-making.
"""
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "torch",
    "gymnasium",
    "matplotlib",
    "pydantic",
    "pytest",
    "black",
    "flake8",
    "pygame",
    "ruff",
    "mypy",
    "pre-commit",
    "rich>=15.0.0",
    "pillow>=12.3.0",
    "resvg-py>=0.3.4",
    "latexmk>=0.0.2",
    "mkdocs>=1.6.1",
    "ipykernel>=7.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/htn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.black]
target-version = ["py312"]
line-length = 88

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
strict = false

[dependency-groups]
docs = [
    "mkdocs-material>=9.7.0",
]
