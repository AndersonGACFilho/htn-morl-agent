site_name: HTN GridWorld
site_description: Documentation for the HTN framework and GridWorld example
site_url: https://example.invalid/htn-gridworld/
repo_name: HTN-GOAP-MORL-Planner

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

plugins:
  - search:
      lang: en

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - HTN Framework:
      - Overview: framework/overview.md
      - Domain and state model: framework/model.md
      - Planner and agent: framework/planning-runtime.md
      - Extensions and integrations: framework/extensions.md
      - Reward mechanism: framework/reward.md
  - GridWorld:
      - Overview: grid-world/overview.md
      - Environment and configuration: grid-world/environment.md
      - Domain, actions, and navigation: grid-world/domain-and-actions.md
      - Runtime, sensors, and rendering: grid-world/runtime.md
  - Proposed architecture:
      - MORL-guided HTN method selection: architecture/symbolic-morl.md
      - Preference-weight generation: architecture/preference-weight-generation.md
  - Learning notes:
      - Planning:
          - Behavior trees: annotations/planning/behavior-trees.md
          - GOAP: annotations/planning/goal-oriented-action-planning.md
          - Hierarchical task networks: annotations/planning/hierarchical-task-network.md
          - Planning methods comparison: annotations/planning/planning-methods-comparison.md
      - Reinforcement learning:
          - Basics: annotations/reinforcement-learning/basics.md
          - Model-free RL: annotations/reinforcement-learning/model-free.md
          - Model-based RL: annotations/reinforcement-learning/model-based.md
          - Multi-objective RL (MORL): annotations/reinforcement-learning/morl.md
          - RL with Options: annotations/reinforcement-learning/rl-with-options.md
  - Reference:
      - Concepts and glossary: reference/glossary.md
      - Bibliography: reference/bibliography.md
